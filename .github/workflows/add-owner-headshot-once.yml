name: Add owner headshot placeholder once

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Anthony Fera placeholder
        shell: python
        run: |
          from pathlib import Path

          p = Path('website/index.html')
          s = p.read_text()

          old = '<div class="owner"><strong>Anthony Fera</strong><span>FOUNDER • OWNER • MASTER ELECTRICIAN & CEO</span></div>'
          avatar = '<span class="teamAvatar" aria-hidden="true"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ownerG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#303030"/><stop offset="1" stop-color="#101010"/></linearGradient></defs><rect width="64" height="64" fill="url(#ownerG)"/><circle cx="32" cy="23" r="11" fill="#858585"/><path d="M11 59c2-15 10-23 21-23s19 8 21 23" fill="#858585"/><path d="M12 58h40" stroke="#ffd21a" stroke-width="2"/></svg></span>'
          new = '<div class="owner ownerWithAvatar">' + avatar + '<div><strong>Anthony Fera</strong><span>FOUNDER • OWNER • MASTER ELECTRICIAN & CEO</span></div></div>'

          if old in s:
              s = s.replace(old, new, 1)

          css_old = '.owner{border-left:4px solid var(--gold);padding:24px;background:#171717;margin:25px 0}'
          css_new = css_old + '.ownerWithAvatar{display:flex;align-items:center;gap:14px}.ownerWithAvatar .teamAvatar{width:52px;height:52px;flex:0 0 52px}'
          if '.ownerWithAvatar{' not in s:
              s = s.replace(css_old, css_new, 1)

          p.write_text(s)
      - name: Remove this one-time workflow
        run: rm .github/workflows/add-owner-headshot-once.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html .github/workflows/add-owner-headshot-once.yml
          git commit -m "Add Anthony Fera headshot placeholder [skip ci]"
          git push
