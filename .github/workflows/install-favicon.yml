name: Install Northern Alliance favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-favicon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create favicon assets and update pages
        shell: python
        run: |
          import base64
          from pathlib import Path

          assets = {
              'favicon-16x16.png': 'iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAc0lEQVR42mNkZWX9z0ABYMEl8evXLwwxNjY2DDEmYjXjEmciVjMueSa8mi9LMzBclsZwOrI6JpxWXZZGaDgritX/uA1A0oxsCPEGkACwG6D7lDwDcPkTX3pgRE+JhKIR3RKKw4ARV16gKCkT43Tae4FYAACpvSfHwexeqwAAAABJRU5ErkJggg==',
              'favicon-32x32.png': '',
              'apple-touch-icon.png': '',
              'favicon-48x48.png': '',
              'favicon.ico': '',
          }

          for name, data in assets.items():
              Path(name).write_bytes(base64.b64decode(data))

          favicon_tags = '''<link rel="icon" href="/favicon.ico" sizes="any">
          <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
          <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
          <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
          <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">'''

          for page in Path('.').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              if 'href="/favicon.ico"' in text:
                  continue
              marker = '<meta name="viewport" content="width=device-width,initial-scale=1">'
              if marker in text:
                  text = text.replace(marker, marker + '\n' + favicon_tags, 1)
              else:
                  text = text.replace('<head>', '<head>\n' + favicon_tags, 1)
              page.write_text(text, encoding='utf-8')

      - name: Commit favicon installation
        run: |
          git rm .github/workflows/install-favicon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Install Northern Alliance favicon [skip ci]"
          git push
