name: Portrait hero video update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh portrait hero video
        shell: python
        run: |
          from pathlib import Path
          p = Path('website/index.html')
          s = p.read_text()
          s = s.replace('VID_20260727_180134_822.mp4', 'VID_20260727_180134_822.mp4?v=hero-20260727-3')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Force browser refresh for new hero video"
          git push