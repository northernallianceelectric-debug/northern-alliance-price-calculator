name: Rename Alex to Alexander

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-name:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update team member name
        run: |
          sed -i 's/<span class="teamName">Alex<\//<span class="teamName">Alexander<\//g' about.html
          git rm .github/workflows/rename-alexander.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Rename Alex to Alexander [skip ci]"
          git push
